name: Mobile Release (Fastlane)

# Mobile Release (Fastlane)

# Full release: version → Android (APK+AAB) ∥ iOS (IPA) → GitHub Release.
# iOS skips gracefully when signing secrets are missing; Android still ships.
#
# Single-app repo: PNPM_FILTER="." — run prebuild/Fastlane from repo root.
# Monorepo: set MOBILE_PATH (e.g. artifacts/mobile), PNPM_FILTER (@workspace/mobile),
#   working-directory: ${{ env.MOBILE_PATH }} on prebuild + Fastlane steps,
#   upload path: ${{ env.MOBILE_PATH }}/release/<ver>+<build>/* from repo root.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (x.y.z)"
        required: true
        default: "1.0.0"
      platform:
        description: "android | ios | both"
        required: true
        default: both
        type: choice
        options: [android, ios, both]
      upload_stores:
        description: "Also upload to Play internal / TestFlight after build"
        required: true
        default: false
        type: boolean

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PNPM_FILTER: "."
  ANDROID_PROJECT_DIR: "android"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: resolve
        env:
          APP_VERSION: ${{ github.event.inputs.version }}
        run: bash scripts/resolve_mobile_version.sh

  android:
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' }}
    needs: version
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_BUILD_NUMBER: ${{ github.run_number }}
      ORG_GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          # Pin pnpm for repos without a package.json "packageManager" field (v4 errors otherwise).
          # Remove this `with:` block if package.json sets packageManager (avoids a version conflict).
          version: 9
      - uses: oven-sh/setup-bun@v2
        if: hashFiles('bun.lockb', 'bun.lock') != ''
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || (hashFiles('yarn.lock') != '' && 'yarn' || (hashFiles('package-lock.json') != '' && 'npm' || '')) }}
      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Install JS dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            if [ "${{ env.PNPM_FILTER }}" = "." ]; then
              pnpm install --frozen-lockfile
            else
              pnpm install --frozen-lockfile --filter "${{ env.PNPM_FILTER }}..."
            fi
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f bun.lockb ] || [ -f bun.lock ]; then
            bun install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Expo prebuild (android) if applicable
        run: |
          if [ "${{ env.SKIP_PREBUILD }}" != "true" ] && ( [ -f "app.json" ] || [ -f "app.config.js" ] || [ -f "app.config.ts" ] ); then
            echo "Expo configuration detected. Running expo prebuild..."
            npx expo prebuild --platform android --no-install
          else
            echo "Skipping expo prebuild (native android/ directory present or SKIP_PREBUILD enabled)."
          fi
      - name: Fastlane Android (APK + AAB)
        env:
          ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON_BASE64: ${{ secrets.PLAY_JSON_BASE64 }}
        run: |
          if [ "${{ github.event.inputs.upload_stores || 'false' }}" = "true" ]; then
            bundle exec fastlane android internal_android
          else
            bundle exec fastlane android build_android
          fi
      - name: Upload android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-${{ needs.version.outputs.version }}-${{ github.run_number }}
          path: |
            release/${{ needs.version.outputs.version }}+${{ github.run_number }}/app-*.apk
            release/${{ needs.version.outputs.version }}+${{ github.run_number }}/app-*.aab
            release/${{ needs.version.outputs.version }}+${{ github.run_number }}/build-metadata.json
          if-no-files-found: error

  ios:
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' }}
    needs: version
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          # Pin pnpm for repos without a package.json "packageManager" field (v4 errors otherwise).
          # Remove this `with:` block if package.json sets packageManager (avoids a version conflict).
          version: 9
      - uses: oven-sh/setup-bun@v2
        if: hashFiles('bun.lockb', 'bun.lock') != ''
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || (hashFiles('yarn.lock') != '' && 'yarn' || (hashFiles('package-lock.json') != '' && 'npm' || '')) }}
      - name: Cache CocoaPods + DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
            ~/Library/Developer/Xcode/DerivedData
          key: pods-${{ runner.os }}-${{ hashFiles('**/Podfile.lock', '**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock') }}
          restore-keys: pods-${{ runner.os }}-
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Install JS dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            if [ "${{ env.PNPM_FILTER }}" = "." ]; then
              pnpm install --frozen-lockfile
            else
              pnpm install --frozen-lockfile --filter "${{ env.PNPM_FILTER }}..."
            fi
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f bun.lockb ] || [ -f bun.lock ]; then
            bun install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Expo prebuild (ios) + pods (if applicable)
        run: |
          if [ "${{ env.SKIP_PREBUILD }}" != "true" ] && ( [ -f "app.json" ] || [ -f "app.config.js" ] || [ -f "app.config.ts" ] ); then
            echo "Expo configuration detected. Running expo prebuild..."
            npx expo prebuild --platform ios --no-install
          fi
          if [ -d "ios" ]; then
            ( cd ios && pod install )
          fi
      - name: Fastlane iOS (IPA)
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_SCHEME: ${{ secrets.IOS_SCHEME }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_PROVISION_PROFILE_NAME: ${{ secrets.IOS_PROVISION_PROFILE_NAME }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }}
          MATCH_DIST_P12_BASE64: ${{ secrets.MATCH_DIST_P12_BASE64 }}
          MATCH_DIST_P12_PASSWORD: ${{ secrets.MATCH_DIST_P12_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.upload_stores || 'false' }}" = "true" ]; then
            bundle exec fastlane ios beta_ios
          else
            bundle exec fastlane ios build_ios
          fi
      - name: Upload ios artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-${{ needs.version.outputs.version }}-${{ github.run_number }}
          path: |
            release/${{ needs.version.outputs.version }}+${{ github.run_number }}/app-*.ipa
            release/${{ needs.version.outputs.version }}+${{ github.run_number }}/build-metadata.json
          if-no-files-found: warn

  publish:
    needs: [version, android, ios]
    if: ${{ always() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release (APK + AAB + IPA)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            dist/**/app-*.apk
            dist/**/app-*.aab
            dist/**/app-*.ipa
            dist/**/build-metadata.json
          fail_on_unmatched_files: false

# Store-only upload (no rebuild): mobile-store-upload.yml (see README.md)
