name: "Mobile Store iOS Upload"
description: "Self-contained: materialize the Fastlane recipe + Ruby (no JS), download the IPA artifact built earlier in the run, and upload it to TestFlight or the App Store. ASC/IOS secrets are read from the caller job's env. Put this job behind a GitHub Environment for the human-approval gate. No separate setup step is required."

inputs:
  version:
    description: "Marketing version (x.y.z) — used to locate the artifact."
    required: true
  mobile-path:
    description: "Expo app root. Use '.' for single-app repos."
    required: false
    default: "."
  ios-target:
    description: "Upload target: testflight | appstore."
    required: false
    default: "testflight"
  artifact-name:
    description: "Artifact to download. Defaults to mobile-ios-<version>-<run_number> when blank."
    required: false
    default: ""
  ruby-version:
    description: "Ruby version for Fastlane."
    required: false
    default: "3.1"

runs:
  using: "composite"
  steps:
    - name: Materialize Fastlane recipe into mobile-path
      shell: bash
      run: |
        set -euo pipefail
        recipe="${{ github.action_path }}/../.."
        dest="${{ inputs.mobile-path }}"
        if [ ! -d "$recipe/fastlane" ]; then
          echo "::error::Recipe not found at $recipe (expected the mobile_ci recipe two levels above this action)."
          exit 1
        fi
        mkdir -p "$dest/scripts"
        rm -rf "$dest/fastlane"
        cp -R "$recipe/fastlane" "$dest/fastlane"
        cp "$recipe/Gemfile" "$dest/Gemfile"
        cp "$recipe/scripts/"*.sh "$dest/scripts/"
        echo "Materialized recipe from $recipe into '$dest'."

    - name: Setup Ruby + Fastlane (bundler-cache)
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true
        working-directory: ${{ inputs.mobile-path }}

    - name: Download IPA artifact (this run)
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name != '' && inputs.artifact-name || format('mobile-ios-{0}-{1}', inputs.version, github.run_number) }}
        path: ${{ inputs.mobile-path }}/release/download

    - name: Upload to ${{ inputs.ios-target }}
      working-directory: ${{ inputs.mobile-path }}
      shell: bash
      env:
        APP_VERSION: ${{ inputs.version }}
        MOBILE_PATH: ${{ inputs.mobile-path }}
      run: |
        set -euo pipefail
        ipa="$(find release/download -name '*.ipa' | head -n1)"
        [ -n "$ipa" ] || { echo "::error::No IPA found in downloaded artifact."; exit 1; }
        if [ "${{ inputs.ios-target }}" = "appstore" ]; then
          bundle exec fastlane ios appstore_submit ipa:"$ipa"
        else
          bundle exec fastlane ios testflight_upload ipa:"$ipa"
        fi
