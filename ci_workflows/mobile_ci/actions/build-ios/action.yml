name: "Mobile Build iOS"
description: "Self-contained iOS build: materialize the Fastlane recipe, set up JS + Ruby/Fastlane, CocoaPods + Expo prebuild + `fastlane ios build_ios`, and upload the IPA. Signing secrets (IOS_*/ASC_*/MATCH_*) are read from the caller job's env. Skips gracefully with no signing secrets. No separate setup step is required."

inputs:
  version:
    description: "Marketing version (x.y.z)."
    required: true
  mobile-path:
    description: "Expo app root. Use '.' for single-app repos."
    required: false
    default: "."
  pnpm-filter:
    description: "pnpm workspace filter for monorepos; '.' installs at mobile-path directly."
    required: false
    default: "."
  app-variant:
    description: "Optional Expo APP_VARIANT passed through to prebuild/build."
    required: false
    default: ""
  artifact-name:
    description: "Uploaded artifact name. Defaults to mobile-ios-<version>-<run_number> when blank."
    required: false
    default: ""
  node-version:
    description: "Node.js version."
    required: false
    default: "22"
  ruby-version:
    description: "Ruby version for Fastlane."
    required: false
    default: "3.1"

runs:
  using: "composite"
  steps:
    - name: Cache CocoaPods + DerivedData
      uses: actions/cache@v4
      with:
        path: |
          ~/.cocoapods
          ~/Library/Caches/CocoaPods
          ~/Library/Developer/Xcode/DerivedData
        key: pods-${{ runner.os }}-${{ hashFiles('**/Podfile.lock', '**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock') }}
        restore-keys: pods-${{ runner.os }}-

    - name: Materialize Fastlane recipe into mobile-path
      shell: bash
      run: |
        set -euo pipefail
        recipe="${{ github.action_path }}/../.."
        dest="${{ inputs.mobile-path }}"
        if [ ! -d "$recipe/fastlane" ]; then
          echo "::error::Recipe not found at $recipe (expected the mobile_ci recipe two levels above this action)."
          exit 1
        fi
        mkdir -p "$dest/scripts"
        rm -rf "$dest/fastlane"
        cp -R "$recipe/fastlane" "$dest/fastlane"
        cp "$recipe/Gemfile" "$dest/Gemfile"
        cp "$recipe/scripts/"*.sh "$dest/scripts/"
        echo "Materialized recipe from $recipe into '$dest'."

    - name: Setup pnpm (if pnpm-lock present)
      if: ${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.mobile-path)) != '' }}
      uses: pnpm/action-setup@v4

    - name: Setup Bun (if bun lockfile present)
      if: ${{ hashFiles(format('{0}/bun.lockb', inputs.mobile-path), format('{0}/bun.lock', inputs.mobile-path)) != '' }}
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.mobile-path)) != '' && 'pnpm' || (hashFiles(format('{0}/yarn.lock', inputs.mobile-path)) != '' && 'yarn' || (hashFiles(format('{0}/package-lock.json', inputs.mobile-path)) != '' && 'npm' || '')) }}
        cache-dependency-path: |
          ${{ inputs.mobile-path }}/pnpm-lock.yaml
          ${{ inputs.mobile-path }}/yarn.lock
          ${{ inputs.mobile-path }}/package-lock.json

    - name: Install JS dependencies
      shell: bash
      working-directory: ${{ inputs.mobile-path }}
      run: |
        set -euo pipefail
        if [ -f pnpm-lock.yaml ]; then
          if [ "${{ inputs.pnpm-filter }}" = "." ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --frozen-lockfile --filter "${{ inputs.pnpm-filter }}..."
          fi
        elif [ -f yarn.lock ]; then
          yarn install --frozen-lockfile
        elif [ -f bun.lockb ] || [ -f bun.lock ]; then
          bun install --frozen-lockfile
        elif [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Setup Ruby + Fastlane (bundler-cache)
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true
        working-directory: ${{ inputs.mobile-path }}

    - name: Expo prebuild (ios) + pods (if applicable)
      working-directory: ${{ inputs.mobile-path }}
      shell: bash
      env:
        APP_VARIANT: ${{ inputs.app-variant }}
      run: |
        set -euo pipefail
        if [ "${SKIP_PREBUILD:-}" != "true" ] && { [ -f "app.json" ] || [ -f "app.config.js" ] || [ -f "app.config.ts" ]; }; then
          echo "Expo config detected — running expo prebuild (ios)."
          npx expo prebuild --platform ios --no-install
        fi
        if [ -d "ios" ]; then
          ( cd ios && pod install )
        fi

    - name: Build iOS IPA (Fastlane)
      working-directory: ${{ inputs.mobile-path }}
      shell: bash
      env:
        APP_VERSION: ${{ inputs.version }}
        APP_BUILD_NUMBER: ${{ github.run_number }}
        MOBILE_PATH: ${{ inputs.mobile-path }}
        APP_VARIANT: ${{ inputs.app-variant }}
      run: bundle exec fastlane ios build_ios version:"${{ inputs.version }}" build:${{ github.run_number }}

    - name: Upload ios artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name != '' && inputs.artifact-name || format('mobile-ios-{0}-{1}', inputs.version, github.run_number) }}
        path: |
          ${{ inputs.mobile-path }}/release/${{ inputs.version }}+${{ github.run_number }}/app-*.ipa
          ${{ inputs.mobile-path }}/release/${{ inputs.version }}+${{ github.run_number }}/build-metadata.json
        if-no-files-found: warn
